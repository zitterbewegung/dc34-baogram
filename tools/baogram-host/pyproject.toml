[project]
name = "baogram-host"
version = "0.1.0"
description = "Laptop peer for Baogram: create, verify, send, and receive signed monochrome badge posts over animated QR codes."
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10",
    "opencv-python>=4.9",
    "qrcode>=7.4",
    "base45>=0.4",
    "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
baogram-host = "baogram_host.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["baogram_host*"]
